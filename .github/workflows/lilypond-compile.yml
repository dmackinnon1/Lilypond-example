name: Generate and Commit Music Snippets

on:
   workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y lilypond ghostscript

      # Compiles snippet.ly into snippet.preview.pdf
      - name: Compile Standalone Graphic
        run: |
          lilypond -dpreview snippet.ly

      # Automatically commit the new PDF asset back into the repo
      - name: Commit and Push PDF to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage the generated file
          git add snippet.preview.pdf
          
          # Only commit and push if the file actually changed
          if git diff-index --quiet HEAD; then
            echo "No changes to the music snippet. Skipping commit."
          else
            git commit -m "Auto-generated fresh LilyPond music snippet [skip ci]"
            git push
          fi
